version: 2

models:
  - name: mart_customer_summary
    description: "Customer-level transaction summary"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: total_amount
        tests:
          - not_null

  - name: mart_transaction_summary
    description: "Transaction summary by category - depends ONLY on stg_transactions (tests independent path)"
    columns:
      - name: currency
        tests:
          - unique
          - not_null

version: 2

models:
  - name: stg_transactions
    description: "Staged transactions - excludes failed transactions"
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

  - name: stg_customers
    description: "Staged customer data"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
